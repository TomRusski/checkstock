name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: checkstock
          POSTGRES_PASSWORD: checkstock
          POSTGRES_DB: checkstock
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U checkstock -d checkstock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://checkstock:checkstock@localhost:15432/checkstock
      TEST_DATABASE_URL: postgresql+psycopg://checkstock:checkstock@localhost:15432/checkstock_test
      SEED_ON_START: "false"
      LANG: C.UTF-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Линтер
        run: ruff check app tests scripts

      - name: Миграции
        run: alembic upgrade head

      - name: Тесты
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Сквозной сценарий против живого сервера
        run: |
          python -m app.seed --force
          uvicorn app.main:app --host 127.0.0.1 --port 18080 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/api/health > /dev/null; then break; fi
            sleep 1
          done
          python scripts/demo_scenario.py --base-url http://127.0.0.1:18080
          python scripts/check_invariants.py --base-url http://127.0.0.1:18080
